name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/ImmortalityClipTracker/Assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The clip guide and the icon live with the desktop app so there is only
      # ever one copy of them in the repository.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp src/ImmortalityClipTracker/Assets/Immortality_Guide.csv _site/
          cp src/ImmortalityClipTracker/Assets/icon.png _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
